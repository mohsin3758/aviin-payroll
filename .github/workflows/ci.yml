name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (payroll engine)
        run: npm test

      - name: Push schema to a throwaway SQLite DB for build/integration
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: file:./db/ci.db

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./db/ci.db

      - name: Integration tests against a real running server
        run: |
          npx next start -p 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api && break
            sleep 1
          done
          # Bootstrap: creates the default admin/hr/manager users the integration
          # suite logs in as (allowed unauthenticated only because zero users exist yet).
          curl -sf -X POST http://localhost:3000/api/seed \
            -H "Content-Type: application/json" \
            -d '{"confirm":"RESET_DEMO_DATA"}'
          npm run test:integration
          kill $SERVER_PID
        env:
          DATABASE_URL: file:./db/ci.db
          JWT_SECRET: ci-test-secret-not-for-production

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t payrollpro:ci .

      - name: Smoke test the built image
        run: |
          docker run -d --name payrollpro-smoke -p 3000:3000 \
            -e JWT_SECRET=ci-test-secret-not-for-production \
            payrollpro:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api && break
            sleep 1
          done
          curl -sf http://localhost:3000/api
          docker logs payrollpro-smoke
          docker stop payrollpro-smoke
